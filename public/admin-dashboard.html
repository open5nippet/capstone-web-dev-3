<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard | CampusCare</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="dashboard-header"><div class="container"><a class="brand" style="color:#fff" href="index.html">CampusCare Admin</a><div>Administrator: <strong id="admin-name"></strong> <button id="logout" class="secondary">Logout</button></div></div></header><main class="container dashboard"><div id="message" class="notice"></div><p class="eyebrow">OVERVIEW</p><h2>Complaint management</h2><section class="stats"><div class="stat"><span>Total</span><strong data-stat="total">0</strong></div><div class="stat"><span>Pending</span><strong data-stat="Pending">0</strong></div><div class="stat"><span>In progress</span><strong data-stat="In Progress">0</strong></div><div class="stat"><span>Resolved</span><strong data-stat="Resolved">0</strong></div><div class="stat"><span>Rejected</span><strong data-stat="Rejected">0</strong></div></section><section class="grid-two" style="grid-template-columns:1fr 360px"><div><form id="filters" class="filters"><select id="status-filter"><option value="">All statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select><select id="category-filter"><option value="">All categories</option><option>Classroom</option><option>Internet/Wi-Fi</option><option>Hostel</option><option>Library</option><option>Transport</option><option>Maintenance</option><option>Other</option></select></form><div id="complaints" class="complaint-list"></div></div><aside id="detail" class="card admin-detail hidden"><p class="eyebrow">PROCESS COMPLAINT</p><h2 id="detail-title"></h2><form id="status-form" style="display:grid;gap:13px"><label class="field">Status<select id="detail-status"><option>Pending</option><option>In Progress</option><option>Resolved</option><option>Rejected</option></select></label><label class="field">Admin remark <span class="muted">(optional)</span><textarea id="detail-remark" maxlength="1000" placeholder="Explain the action taken or next step..."></textarea></label><button>Save update</button></form></aside></section></main><script type="module" src="js/admin.js"></script></body></html>
