<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Dashboard | CampusCare</title><link rel="stylesheet" href="css/styles.css"></head><body><header class="dashboard-header"><div class="container"><a class="brand" style="color:#fff" href="index.html">CampusCare</a><div>Welcome, <strong id="student-name"></strong> <button id="logout" class="secondary">Logout</button></div></div></header><main class="container dashboard"><div id="message" class="notice"></div><div class="grid-two"><section class="card"><p class="eyebrow">REPORT AN ISSUE</p><h2>Submit a complaint</h2><form id="complaint-form" style="display:grid;gap:13px"><label class="field">Title<input name="title" required minlength="5" maxlength="100" placeholder="e.g. Wi-Fi unavailable in Block B"></label><label class="field">Description<textarea name="description" required minlength="10" maxlength="2000" placeholder="Describe the problem clearly..."></textarea></label><label class="field">Category<select name="category" required><option value="">Choose a category</option><option>Classroom</option><option>Internet/Wi-Fi</option><option>Hostel</option><option>Library</option><option>Transport</option><option>Maintenance</option><option>Other</option></select></label><label class="field">Location <span class="muted">(optional)</span><input name="location" maxlength="120" placeholder="e.g. Academic Block B, Room 204"></label><button>Submit complaint</button></form></section><section><p class="eyebrow">MY COMPLAINTS</p><h2>Track your reports</h2><p class="muted">Only pending reports can be deleted. Status changes are made by administrators.</p><div id="complaints" class="complaint-list"></div></section></div></main><script type="module" src="js/student.js"></script></body></html>
